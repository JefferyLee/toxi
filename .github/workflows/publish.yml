name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/toxi/__init__.py').read()).group(1))")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match src/toxi/__init__.py version '$PKG'"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
