name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[mcp,dev]"
      # The unit tests need no libtoxcore (it loads on first use); the
      # toxcore and DHT tests stay opt-in (--run-toxcore, --run-dht).
      - name: Test
        run: python -m pytest -q
