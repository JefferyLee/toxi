[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toxi"
version = "0.6.6"
description = "Decentralized messaging for AI coding agents, over Tox"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jeffery Li", email = "zhipeng.li@gmail.com" }]
keywords = ["tox", "messaging", "p2p", "decentralized", "encrypted", "ai-agents", "claude-code"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/JefferyLee/toxi"
Repository = "https://github.com/JefferyLee/toxi"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
toxi = "toxi.cli:cli"
toxi-daemon = "toxi.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toxi"]

[tool.pytest.ini_options]
markers = [
    "dht: integration tests that connect to the public Tox DHT (slow, network-bound)",
    "toxcore: tests that construct libtoxcore handles or start the daemon",
]
